<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>إنشاء أيقونات الإضافة</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            direction: rtl;
        }
        .icon-preview {
            margin: 10px;
            display: inline-block;
            text-align: center;
        }
        canvas {
            border: 1px solid #ccc;
        }
        h1 { color: #063D31; }
        .btn {
            background: #00AD68;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        .btn:hover { background: #008d55; }
        #output { margin-top: 20px; }
        .download-link {
            display: block;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>🎨 إنشاء أيقونات إضافة Chrome</h1>
    <p>اضغط على الزر لإنشاء وتحميل الأيقونات</p>
    
    <div id="icons">
        <div class="icon-preview">
            <canvas id="icon16" width="16" height="16"></canvas>
            <p>16x16</p>
        </div>
        <div class="icon-preview">
            <canvas id="icon48" width="48" height="48"></canvas>
            <p>48x48</p>
        </div>
        <div class="icon-preview">
            <canvas id="icon128" width="128" height="128"></canvas>
            <p>128x128</p>
        </div>
    </div>
    
    <button class="btn" onclick="generateIcons()">إنشاء الأيقونات</button>
    <button class="btn" onclick="downloadAll()">تحميل الكل</button>
    
    <div id="output"></div>
    
    <script>
        function drawIcon(ctx, size) {
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#00AD68');
            gradient.addColorStop(1, '#063D31');
            
            // Rounded rectangle background
            const radius = size * 0.18;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Draw scales of justice
            ctx.strokeStyle = 'white';
            ctx.fillStyle = 'white';
            ctx.lineWidth = Math.max(1, size / 16);
            ctx.lineCap = 'round';
            
            const cx = size / 2;
            const cy = size / 2;
            const scale = size / 128;
            
            // Center pole
            ctx.fillRect(cx - 3*scale, cy - 25*scale, 6*scale, 40*scale);
            
            // Top bar
            ctx.beginPath();
            ctx.moveTo(cx - 30*scale, cy - 28*scale);
            ctx.lineTo(cx + 30*scale, cy - 28*scale);
            ctx.stroke();
            
            // Left chain
            ctx.beginPath();
            ctx.moveTo(cx - 25*scale, cy - 28*scale);
            ctx.lineTo(cx - 25*scale, cy - 5*scale);
            ctx.stroke();
            
            // Right chain
            ctx.beginPath();
            ctx.moveTo(cx + 25*scale, cy - 28*scale);
            ctx.lineTo(cx + 25*scale, cy - 5*scale);
            ctx.stroke();
            
            // Left plate
            ctx.beginPath();
            ctx.ellipse(cx - 25*scale, cy, 15*scale, 6*scale, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Right plate
            ctx.beginPath();
            ctx.ellipse(cx + 25*scale, cy, 15*scale, 6*scale, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Base
            ctx.fillRect(cx - 18*scale, cy + 18*scale, 36*scale, 6*scale);
        }
        
        function generateIcons() {
            const sizes = [16, 48, 128];
            sizes.forEach(size => {
                const canvas = document.getElementById('icon' + size);
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, size, size);
                drawIcon(ctx, size);
            });
        }
        
        function downloadIcon(size) {
            const canvas = document.getElementById('icon' + size);
            const link = document.createElement('a');
            link.download = `icon${size}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        function downloadAll() {
            [16, 48, 128].forEach(size => {
                setTimeout(() => downloadIcon(size), size * 10);
            });
        }
        
        // Generate icons on load
        window.onload = generateIcons;
    </script>
</body>
</html>

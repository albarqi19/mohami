<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00AD68"/>
      <stop offset="100%" stop-color="#063D31"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bgGradient)"/>
  
  <!-- Scales of Justice -->
  <g transform="translate(64, 64)">
    <!-- Center pole -->
    <rect x="-4" y="-35" width="8" height="55" fill="white"/>
    
    <!-- Top bar -->
    <rect x="-40" y="-40" width="80" height="6" rx="3" fill="white"/>
    
    <!-- Left plate chain -->
    <line x1="-35" y1="-34" x2="-35" y2="-10" stroke="white" stroke-width="3"/>
    
    <!-- Right plate chain -->
    <line x1="35" y1="-34" x2="35" y2="-10" stroke="white" stroke-width="3"/>
    
    <!-- Left plate -->
    <ellipse cx="-35" cy="-5" rx="20" ry="8" fill="white"/>
    
    <!-- Right plate -->
    <ellipse cx="35" cy="-5" rx="20" ry="8" fill="white"/>
    
    <!-- Base -->
    <path d="M-20 25 L20 25 L15 20 L-15 20 Z" fill="white"/>
    <rect x="-25" y="25" width="50" height="8" rx="2" fill="white"/>
  </g>
  
  <!-- Arabic letter ن for Najiz -->
  <text x="64" y="105" font-family="Arial" font-size="24" fill="white" text-anchor="middle" font-weight="bold">ن</text>
</svg>
